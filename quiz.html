
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz | Desafio do Saber</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="cabecalho">
        <a href="index.html" class="logo">Desafio do Saber</a>

        <nav>
            <a href="index.html">Início</a>
            <a href="matematica.html">Matemática</a>
        </nav>
    </header>

    <main class="disciplinas">
        <h1>Desafio de Matemática</h1>

        <section class="card">
            <p id="progresso">Pergunta 1</p>

            <h2 id="enunciado">Carregando pergunta...</h2>

            <div id="alternativas"></div>

            <p id="feedback" aria-live="polite"></p>

            <button id="proximo" type="button" hidden>
                Próxima pergunta
            </button>

            <div id="resultado" hidden>
                <h2>Desafio concluído!</h2>

                <p id="pontuacao-final"></p>

                <p id="porcentagem"></p>

                <p id="mensagem-resultado"></p>

                <button id="tentar-novamente" type="button">
                    Tentar novamente
                </button>

                <a href="matematica.html" class="botao">
                    Voltar aos conteúdos
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p>Desafio do Saber — Aprender pode ser divertido!</p>
    </footer>

    <script src="js/perguntas.js"></script>
    <script src="js/pontuacao.js"></script>
    <script src="js/quiz.js"></script>

</body>
</html>
